[project]
name = "bd-state-annotation"
version = "0.1.0"
description = "LLM-based longitudinal state annotation of Reddit posts for bipolar disorder research"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
