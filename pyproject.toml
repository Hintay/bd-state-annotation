[project]
name = "bd-state-annotation"
version = "0.1.0"
description = "LLM-based longitudinal state annotation of Reddit posts for bipolar disorder research"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "google-genai>=0.3.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# This is a runnable demo, not an installable library: run it from the repo root
# with `python main.py ...`. Tell uv not to build/install the project itself, so
# `uv sync` only provisions the dependencies (no build backend required).
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
